[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-controller-builder"
version = "0.1.0"
description = "MCP server for generating hexagonal CRUD scaffolding"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2"]

[project.optional-dependencies]
database = ["sqlalchemy>=2.0"]

[project.scripts]
mcp-controller-builder = "mcp_controller_builder.server:main"

[tool.setuptools.packages.find]
include = ["mcp_controller_builder*"]
